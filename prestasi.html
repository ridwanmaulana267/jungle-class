<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle Achievements — XI IPS 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { jungle: { 950: '#09130d', 900: '#0f2217', 500: '#10b981', 400: '#34d399' } } } } }
    </script>
</head>
<body class="bg-jungle-950 text-slate-200 p-6 min-h-screen">
    
    <div class="max-w-5xl mx-auto">
        <a href="index.html" class="inline-flex items-center gap-2 text-xs font-bold text-jungle-400 mb-6 hover:underline">
            <i class="fa-solid fa-arrow-left"></i> Kembali ke Home
        </a>

        <div class="mb-8 text-center">
            <span class="text-xs font-bold uppercase text-yellow-400">Achievement Mountain</span>
            <h1 class="text-3xl font-extrabold text-white">PRESTASI KELAS</h1>
        </div>

        <div id="achievements-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </div>

    <script>
        const classData = {
            achievements: [
                { title: "Juara 1 Esport Mobile Legends", date: "Desember 2025", cat: "Olahraga", desc: "Tim Esport XI IPS 2 berhasil meraih trofi utama tanpa terkalahkan." },
                { title: "Juara 1 Kelas Terbersih & Terestetik 2026", date: "Agustus 2026", cat: "Penghargaan", desc: "Penghargaan Kelas Terbersih" },
                { title: "Juara 1 Battle of Passions September edition", date: "September 2026", cat: "Penghargaan", desc: "Penghargaan Juara 1 Battle of Passions" }
            ]
        };

        document.getElementById('achievements-grid').innerHTML = classData.achievements.map(a => `
            <div class="bg-jungle-900 p-6 rounded-2xl border border-yellow-500/20 text-center">
                <div class="w-12 h-12 mx-auto rounded-full bg-yellow-500/20 text-yellow-400 flex items-center justify-center text-xl mb-3">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <span class="text-[10px] font-bold text-yellow-400 uppercase">${a.cat} • ${a.date}</span>
                <h3 class="font-bold text-white text-lg mt-1">${a.title}</h3>
                <p class="text-xs text-slate-300 mt-2">${a.desc}</p>
            </div>
        `).join('');
    </script>
</body>
</html>
