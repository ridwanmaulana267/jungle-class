<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Jungle Explorers — XI IPS 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { jungle: { 950: '#09130d', 900: '#0f2217', 500: '#10b981', 400: '#34d399' } } } } }
    </script>
</head>
<body class="bg-jungle-950 text-slate-200 p-6 min-h-screen">
    
    <div class="max-w-6xl mx-auto">
        <a href="index.html" class="inline-flex items-center gap-2 text-xs font-bold text-jungle-400 mb-6 hover:underline">
            <i class="fa-solid fa-arrow-left"></i> Kembali ke Home
        </a>

        <div class="flex flex-col md:flex-row md:items-end justify-between mb-8 gap-4">
            <div>
                <span class="text-xs font-bold uppercase text-emerald-400">Struktur Pengurus & Divisi</span>
                <h1 class="text-3xl font-extrabold text-white">OUR JUNGLE EXPLORERS</h1>
            </div>

            <!-- Search & Filter -->
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="search-input" placeholder="Cari nama atau jabatan..." class="px-4 py-2 bg-jungle-900 border border-white/10 rounded-xl text-xs text-white focus:outline-none focus:border-jungle-500">
                <div class="flex gap-2">
                    <button onclick="filterType('all')" class="px-3 py-2 bg-jungle-500 text-jungle-950 rounded-xl font-bold text-xs btn-filter">Semua</button>
                    <button onclick="filterType('pengurus')" class="px-3 py-2 bg-jungle-900 border border-white/10 rounded-xl font-bold text-xs btn-filter">Pengurus Inti</button>
                    <button onclick="filterType('divisi')" class="px-3 py-2 bg-jungle-900 border border-white/10 rounded-xl font-bold text-xs btn-filter">Divisi & Seksi</button>
                </div>
            </div>
        </div>

        <div id="members-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </div>

    <script>
        const classData = {
            members: [
                { name: "Dede Hasan Nurjaman", role: "Wali Kelas", type: "pengurus", icon: "fa-chalkboard-user", quote: "Pembimbing & pengarah XI IPS 2." },
                { name: "M Yasir Al Munawar", role: "Ketua Murid", type: "pengurus", icon: "fa-crown", quote: "Memimpin dengan aksi, bertumbuh bersama." },
                { name: "M Fikri Abdul Aziz", role: "Wakil Ketua Murid", type: "pengurus", icon: "fa-star", quote: "Selalu ada solusi di setiap petualangan." },
                { name: "Puput Putriani", role: "Sekretaris 1", type: "pengurus", icon: "fa-pen-to-square", quote: "Catatan rapi, kelas terkendali." },
                { name: "Dethala Inari Putri", role: "Sekretaris 2", type: "pengurus", icon: "fa-file-signature", quote: "Mendokumentasikan setiap langkah kelas." },
                { name: "Ulpah Jain Inayah", role: "Bendahara 1", type: "pengurus", icon: "fa-wallet", quote: "Kas aman, kegiatan jalan!" },
                { name: "Dewi Nadariyah", role: "Bendahara 2", type: "pengurus", icon: "fa-coins", quote: "Kelola keuangan dengan transparan." },
                { name: "Ridwan Mukti Maulana", role: "Keamanan 1", type: "divisi", icon: "fa-shield-halved", quote: "Menjaga ketertiban & kedisiplinan." },
                { name: "Randi Mardiana Rahmat", role: "Keamanan 2", type: "divisi", icon: "fa-user-shield", quote: "Kelas aman, belajar nyaman." },
                { name: "Asmawa'ati", role: "Kerohanian 1", type: "divisi", icon: "fa-hands-praying", quote: "Memperkuat iman & kebersamaan." },
                { name: "Akmal Latif Al-Khoarizmi", role: "Kerohanian 2", type: "divisi", icon: "fa-book-quran", quote: "Toleransi & kebaikan utama." },
                { name: "Lutfia Septia Ramadhani", role: "Pendidikan 1", type: "divisi", icon: "fa-graduation-cap", quote: "Saling bantu dalam akademis." },
                { name: "Rehan Maulana", role: "Pendidikan 2", type: "divisi", icon: "fa-book-open", quote: "IPS Jaya, prestasi utama." },
                { name: "Ahmad Barokah", role: "Kebersihan 1", type: "divisi", icon: "fa-broom", quote: "Kelas bersih, pikiran jernih." },
                { name: "Ega Odikta Septiani", role: "Kebersihan 2", type: "divisi", icon: "fa-broom", quote: "Lingkungan rapi, kenyamanan bersama." },
                { name: "Asti Sukmawati", role: "Kesenian 1", type: "divisi", icon: "fa-palette", quote: "Menciptakan warna di Jungle Class." },
                { name: "Revi Febriyani Syapariyah", role: "Kesenian 2", type: "divisi", icon: "fa-music", quote: "Kreativitas tanpa batas." },
                { name: "Aceng Miftah Farid", role: "Logistik & Kreatif 1", type: "divisi", icon: "fa-boxes-packing", quote: "Perlengkapan siap, acara lancar." },
                { name: "Rival Maulana", role: "Logistik & Kreatif 2", type: "divisi", icon: "fa-lightbulb", quote: "Inovasi & persiapan matang." }
            ]
        };

        function render(data) {
            document.getElementById('members-grid').innerHTML = data.map(m => `
                <div class="bg-jungle-900 p-5 rounded-2xl text-center border border-white/10 hover:border-jungle-500 transition flex flex-col justify-between">
                    <div>
                        <div class="w-16 h-16 mx-auto rounded-2xl bg-jungle-500/20 text-jungle-400 flex items-center justify-center text-2xl mb-3">
                            <i class="fa-solid ${m.icon}"></i>
                        </div>
                        <span class="text-[10px] font-bold uppercase px-2.5 py-1 rounded ${m.type === 'pengurus' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-jungle-500/20 text-jungle-300 border border-jungle-500/30'}">${m.role}</span>
                        <h3 class="font-bold text-white text-base mt-2">${m.name}</h3>
                    </div>
                    <p class="text-xs text-slate-400 italic mt-3">"${m.quote}"</p>
                </div>
            `).join('');
        }

        function filterType(type) {
            if (type === 'all') render(classData.members);
            else render(classData.members.filter(m => m.type === type));
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            render(classData.members.filter(m => m.name.toLowerCase().includes(val) || m.role.toLowerCase().includes(val)));
        });

        render(classData.members);
    </script>
</body>
</html>
